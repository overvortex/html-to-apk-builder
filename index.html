<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My HTML App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1em;
        }
        
        .card {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .card h2 {
            color: #667eea;
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        
        .card p {
            color: #555;
            line-height: 1.6;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-bottom: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome!</h1>
        <p class="subtitle">This is your HTML to APK app</p>
        
        <div class="card">
            <h2>🚀 Getting Started</h2>
            <p>Edit the index.html file to customize your app. Every time you push changes, a new APK will be automatically built!</p>
        </div>
        
        <div class="card">
            <h2>📱 Mobile Ready</h2>
            <p>This app is optimized for mobile devices and will work great on Android phones and tablets.</p>
        </div>
        
        <button onclick="alert('Hello! Edit me in index.html')">Click Me!</button>
        <button onclick="showInfo()">Show Info</button>
    </div>
    
    <script>
        function showInfo() {
            alert('User Agent: ' + navigator.userAgent + '\n\nDevice is ready for your app!');
        }
    </script>
</body>
</html>
